<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>PictureNames · Лобби</title>
		<link rel="stylesheet" href="/styles.css" />
		<style>
			/* === Лобби-специфичное === */

			.lobby-shell {
			max-width: 720px;
			}

			/* Экран входа */
			.enter-card {
			display: flex;
			flex-direction: column;
			gap: 1rem;
			}

			.enter-title {
			font-weight: 300;
			font-size: 26px;
			letter-spacing: 0.05em;
			margin: 0 0 0.2rem;
			}
			.enter-sub {
			font-size: 13px;
			color: var(--text-dim);
			margin: 0 0 0.6rem;
			}

			.divider {
			display: flex;
			align-items: center;
			gap: 0.8rem;
			color: var(--text-mute);
			font-size: 11px;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			margin: 0.4rem 0;
			}
			.divider::before,
			.divider::after {
			content: '';
			flex: 1;
			height: 1px;
			background: var(--border);
			}

			/* Экран лобби */
			.lobby-head {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 1rem;
			flex-wrap: wrap;
			margin-bottom: 1rem;
			}

			.room-label {
			font-size: 11px;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: var(--text-mute);
			margin: 0 0 0.4rem;
			}
			.code-display {
			font-family: ui-monospace, "SF Mono", monospace;
			font-size: 28px;
			letter-spacing: 0.35em;
			color: var(--accent);
			text-shadow: 0 0 20px rgba(122, 184, 255, 0.35);
			margin: 0;
			font-weight: 400;
			}

			/* Информация о наборе картинок */
			.pack-info {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.55rem 0.85rem;
			background: rgba(0, 0, 0, 0.25);
			border: 1px solid var(--border);
			border-radius: 8px;
			font-size: 13px;
			margin-bottom: 1rem;
			}
			.pack-info[hidden] { display: none; }
			.pack-label {
			color: var(--text-mute);
			font-size: 11px;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			}
			.pack-value {
			font-family: ui-monospace, "SF Mono", monospace;
			color: var(--accent);
			}
			.pack-count {
			margin-left: auto;
			color: var(--text-dim);
			font-size: 12px;
			font-family: ui-monospace, "SF Mono", monospace;
			letter-spacing: 0.02em;
			}
			.pack-count.low { color: var(--err); font-weight: 500; }
			.pack-count.ok { color: var(--ok); }

			#btn-return-to-game {
			margin-bottom: 1rem;
			width: 100%;
			}

			/* Команды */
			.teams {
			display: flex;
			flex-direction: column;
			gap: 0.9rem;
			margin-bottom: 1rem;
			}

			.team-block {
			position: relative;
			padding: 1rem 1.1rem;
			border-radius: 12px;
			border: 1px solid var(--border);
			overflow: hidden;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			}
			.team-block::before {
			content: '';
			position: absolute;
			left: 0; top: 0; bottom: 0;
			width: 3px;
			}
			.team-block.Blue {
			background: linear-gradient(90deg, rgba(20, 36, 61, 0.7), rgba(20, 36, 61, 0.3));
			border-color: rgba(122, 184, 255, 0.18);
			}
			.team-block.Blue::before {
			background: linear-gradient(180deg, var(--blue-accent), transparent);
			box-shadow: 0 0 16px rgba(122, 184, 255, 0.5);
			}
			.team-block.Red {
			background: linear-gradient(90deg, rgba(61, 22, 22, 0.7), rgba(61, 22, 22, 0.3));
			border-color: rgba(255, 154, 154, 0.18);
			}
			.team-block.Red::before {
			background: linear-gradient(180deg, var(--red-accent), transparent);
			box-shadow: 0 0 16px rgba(255, 154, 154, 0.5);
			}

			.team-block h3 {
			margin: 0 0 0.7rem;
			font-weight: 500;
			font-size: 11px;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			}
			.team-block.Blue h3 { color: var(--blue-accent); }
			.team-block.Red h3 { color: var(--red-accent); }

			/* Участники */
			.member {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 0.55rem 0.7rem;
			background: rgba(0, 0, 0, 0.28);
			border: 1px solid rgba(255, 255, 255, 0.04);
			border-radius: 8px;
			margin-bottom: 0.4rem;
			font-size: 14px;
			gap: 0.5rem;
			transition: background 0.2s ease;
			}
			.member:last-child { margin-bottom: 0; }
			.member:hover { background: rgba(0, 0, 0, 0.4); }

			.member-name {
			display: flex;
			align-items: center;
			gap: 0.35rem;
			flex-wrap: wrap;
			min-width: 0;
			}
			.member .crown {
			font-size: 13px;
			filter: drop-shadow(0 0 4px rgba(255, 207, 122, 0.6));
			}
			.member .role-tag {
			font-size: 10px;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			color: var(--text-mute);
			padding: 1px 6px;
			border-radius: 4px;
			background: rgba(255, 255, 255, 0.04);
			}
			.member .offline {
			font-size: 10px;
			color: var(--text-mute);
			letter-spacing: 0.08em;
			text-transform: uppercase;
			}
			.member .offline::before {
			content: '●';
			margin-right: 3px;
			color: #4a4a52;
			}

			.member-actions {
			display: flex;
			gap: 0.3rem;
			flex-shrink: 0;
			}

			/* Без команды */
			.orphans-title {
			font-size: 11px;
			font-weight: 500;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: var(--text-mute);
			margin: 1.2rem 0 0.5rem;
			}

			.empty {
			color: var(--text-mute);
			font-size: 13px;
			font-style: italic;
			padding: 0.4rem 0.7rem;
			}

			/* Действия */
			.lobby-actions {
			display: flex;
			gap: 0.5rem;
			margin-top: 1.2rem;
			flex-wrap: wrap;
			}
			.lobby-actions > * { flex: 1; min-width: 140px; }

			#btn-start {
			background: linear-gradient(180deg, #1a3a1a, #143014);
			border-color: rgba(110, 232, 154, 0.35);
			color: #9ae09a;
			}
			#btn-start:hover:not(:disabled) {
			background: linear-gradient(180deg, #234a23, #1a3a1a);
			border-color: rgba(110, 232, 154, 0.7);
			color: #c8f0c8;
			box-shadow: 0 0 24px rgba(110, 232, 154, 0.2);
			}
			#btn-leave-room {
			background: rgba(255, 255, 255, 0.02);
			color: var(--text-dim);
			border-color: var(--border);
			}
			#btn-leave-room:hover {
			background: rgba(255, 90, 90, 0.08);
			color: var(--err);
			border-color: rgba(255, 138, 138, 0.4);
			}
		</style>
	</head>
	<body>

		<div class="bg-orbs" aria-hidden="true">
			<div class="orb orb-1"></div>
			<div class="orb orb-2"></div>
			<div class="orb orb-3"></div>
		</div>
		<div class="bg-grid" aria-hidden="true"></div>

		<main class="shell lobby-shell">

			<header class="header">
				<a class="brand" href="/">
					<div class="brand-mark" aria-hidden="true">PN</div>
					<div>
						<h1>PictureNames</h1>
						<p class="tagline">Лобби</p>
					</div>
				</a>
				<div class="status warn" id="status">
					<span class="dot"></span>
					<span class="status-text">Соединение…</span>
				</div>
			</header>

			<!-- === Экран входа === -->
			<div class="glass-card enter-card" id="screen-enter">
				<div>
					<h2 class="enter-title">Войти в игру</h2>
					<p class="enter-sub">Создай комнату или присоединись по коду</p>
				</div>

				<input class="input" id="nick" placeholder="Твой ник" value="riht" maxlength="24" />
				<button class="btn btn-primary" id="btn-create">Создать комнату</button>

				<div class="divider">или</div>

				<input class="input" id="code" placeholder="Код комнаты" maxlength="4"
					   style="text-transform: uppercase; font-family: ui-monospace, monospace; letter-spacing: 0.3em; text-align: center; font-size: 18px;" />
				<button class="btn" id="btn-join">Войти по коду</button>

				<div class="error" id="error"></div>
			</div>

			<!-- === Экран лобби === -->
			<div class="glass-card" id="screen-lobby" hidden="">

				<div class="lobby-head">
					<div>
						<p class="room-label">Код комнаты</p>
						<p class="code-display" id="room-code">----</p>
					</div>
				</div>

				<div class="pack-info" id="pack-info" hidden="">
					<span class="pack-label">Набор картинок</span>
					<span class="pack-value" id="pack-value">—</span>
					<span class="pack-count" id="pack-count"></span>
				</div>

				<button class="btn btn-success" id="btn-return-to-game" style="display: none;">
					← Вернуться в партию
				</button>

				<div class="teams">
					<div class="team-block Blue">
						<h3>Синие</h3>
						<div id="team-Blue"></div>
					</div>
					<div class="team-block Red">
						<h3>Красные</h3>
						<div id="team-Red"></div>
					</div>
				</div>

				<p class="orphans-title">Без команды</p>
				<div id="team-none"></div>

				<div class="lobby-actions">
					<button class="btn" id="btn-start" hidden="">Начать игру</button>
					<button class="btn" id="btn-leave-room">Покинуть комнату</button>
				</div>

				<div class="error" id="lobby-error"></div>
			</div>

			<footer class="seal">// [riht] est via recta () =&gt; {真理} &gt; {}</footer>

		</main>

		<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
		<script>
			// STAY = "я вернулся в лобби осознанно, не выкидывай меня в игру автоматически,
			//         если партия УЖЕ идёт". Но если партия НАЧИНАЕТСЯ заново — идём все.
			const STAY = new URLSearchParams(window.location.search).get('stay') === '1';

			const state = {
			connection: null,
			roomId: null,
			myPlayerId: null,
			myNickname: null,
			lobby: null,
			previousState: null,
			};
			const $ = id => document.getElementById(id);

			// Кэш паков — запрашиваем один раз, потом переиспользуем
			let packsCache = null;

			// === Статус-индикатор ===
			const statusEl = $('status');
			const statusText = statusEl.querySelector('.status-text');
			function setStatus(text, kind) {
			statusText.textContent = text;
			statusEl.classList.remove('ok', 'warn', 'err');
			if (kind) statusEl.classList.add(kind);
			}

			async function post(url, body) {
			const resp = await fetch(url, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(body)
			});
			if (!resp.ok) {
			const err = await resp.json().catch(() => ({}));
			throw new Error(err.error || `HTTP ${resp.status}`);
			}
			return resp.json();
			}

			async function get(url) {
			const resp = await fetch(url, { cache: 'no-store' });
			if (!resp.ok) {
			const err = await resp.json().catch(() => ({}));
			throw new Error(err.error || `HTTP ${resp.status}`);
			}
			return resp.json();
			}

			function findMe(lobby) {
			if (!lobby || !lobby.players) return null;
			if (state.myPlayerId) {
			const byId = lobby.players.find(p => p.id === state.myPlayerId);
			if (byId) return byId;
			}
			if (state.myNickname) {
			const byNick = lobby.players.find(p => p.nickname === state.myNickname);
			if (byNick) {
			state.myPlayerId = byNick.id;
			return byNick;
			}
			}
			return null;
			}

			function goToGame(lobby) {
			const me = findMe(lobby);
			if (!me) return false;
			window.location.href = `/game.html?roomId=${lobby.roomId}&playerId=${me.id}`;
			return true;
			}

			async function ensureConnection() {
			if (state.connection) return state.connection;

			const conn = new signalR.HubConnectionBuilder()
			.withUrl('/gamehub')
			.withAutomaticReconnect()
			.build();

			conn.on('LobbyUpdated', l => {
			const prev = state.previousState;
			state.previousState = l.state;
			state.lobby = l;

			const gameStarted = (prev === 'Lobby')
			&& (l.state === 'InGame' || l.state === 'Finished');

			if (gameStarted) {
			goToGame(l);
			return;
			}

			render(l);
			});

			conn.onreconnecting(() => setStatus('Переподключение…', 'warn'));
			conn.onreconnected(async () => {
			setStatus('Подключено · ' + conn.connectionId.slice(0, 8), 'ok');
			try {
			await conn.invoke('JoinRoom', state.roomId, state.myPlayerId);
			} catch (e) {
			console.error('JoinRoom failed', e);
			}
			});
			conn.onclose(() => setStatus('Соединение закрыто', 'err'));

			await conn.start();
			state.connection = conn;
			return conn;
			}

			async function enterLobby(lobby) {
			state.roomId = lobby.roomId;
			state.lobby = lobby;
			if (state.previousState === null) state.previousState = lobby.state;

			if (!STAY && (lobby.state === 'InGame' || lobby.state === 'Finished')) {
			const me = findMe(lobby);
			if (me) {
			window.location.href = `/game.html?roomId=${lobby.roomId}&playerId=${me.id}`;
			return;
			}
			}

			$('screen-enter').hidden = true;
			$('screen-lobby').hidden = false;
			render(lobby);

			const conn = await ensureConnection();
			try {
			await conn.invoke('JoinRoom', state.roomId, state.myPlayerId);
			} catch (e) {
			console.error('[JoinRoom]', e);
			$('lobby-error').textContent = 'Не удалось подключиться к комнате.';
			}
			setStatus('Подключено · ' + conn.connectionId.slice(0, 8), 'ok');
			}

			function render(lobby) {
			$('room-code').textContent = lobby.code;

			renderTeam('Blue', lobby);
			renderTeam('Red', lobby);

			const none = $('team-none');
			none.innerHTML = '';
			const orphans = lobby.players.filter(p => !p.teamColor);
			if (orphans.length === 0) {
			none.innerHTML = '<div class="empty">Пусто</div>';
			} else {
			for (const p of orphans) none.appendChild(makeMember(p, lobby, 'none'));
			}

			const me = findMe(lobby);
			const inGame = lobby.state === 'InGame' || lobby.state === 'Finished';

			const returnBtn = $('btn-return-to-game');
			if (inGame && me && me.role !== 'Spectator' && me.teamId) {
			returnBtn.style.display = 'flex';
			} else {
			returnBtn.style.display = 'none';
			}

			$('btn-start').hidden = !(me && me.isHost) || inGame;
			$('btn-start').disabled = !canStart(lobby);

			renderPackInfo();
			}

			function canStart(lobby) {
			for (const color of ['Blue', 'Red']) {
			const members = lobby.players.filter(p => p.teamColor === color);
			if (members.length < 2) return false;
            const team = lobby.teams.find(t => t.color === color);
            if (!team || !team.spymasterId) return false;
        }
        return true;
    }

    // Показываем набор картинок: имя пака и количество
    async function renderPackInfo() {
        const el = $('pack-info');
        if (!el) return;

        // Имя пака пока хардкодим — оно появится в LobbyDto позже,
        // когда сделаем выбор папки в UI.
        const packName = 'default';

        try {
            if (!packsCache) {
                packsCache = await get('/api/image-packs');
            }
            const pack = packsCache.find(p => p.name === packName);
            if (!pack) { el.hidden = true; return; }

            $('pack-value').textContent = pack.name;

            const countEl = $('pack-count');
            countEl.classList.remove('low', 'ok');

            if (pack.count >= 25) {
                countEl.textContent = `${pack.count} картинок`;
                countEl.classList.add('ok');
            } else {
                countEl.textContent = `${pack.count} картинок · нужно минимум 25`;
                countEl.classList.add('low');
            }
            el.hidden = false;
        } catch (e) {
            console.warn('[pack info]', e);
            el.hidden = true;
        }
    }

    function renderTeam(color, lobby) {
        const container = $('team-' + color);
        container.innerHTML = '';
        const members = lobby.players.filter(p => p.teamColor === color);
        if (members.length === 0) {
            container.innerHTML = '<div class="empty">Пусто</div>';
			return;
			}
			for (const p of members) container.appendChild(makeMember(p, lobby, color));
			}

			function makeMember(player, lobby, currentTeam) {
			const div = document.createElement('div');
			div.className = 'member';

			const left = document.createElement('div');
			left.className = 'member-name';
			const crown = player.isHost ? '<span class="crown" title="Хост">👑</span>' : '';
			const roleLabel = player.role === 'Spymaster' ? '<span class="role-tag">Спаймастер</span>'
			: (player.role === 'Spectator' ? '<span class="role-tag">Зритель</span>' : '');
			const offline = player.isConnected ? '' : '<span class="offline">offline</span>';
			left.innerHTML = `<span>${escapeHtml(player.nickname)}</span>${crown}${roleLabel}${offline}`;
			div.appendChild(left);

			const me = findMe(lobby);
			if (!me || me.id !== player.id) return div;

			const actions = document.createElement('div');
			actions.className = 'member-actions';

			if (currentTeam === 'none') {
			const blueBtn = document.createElement('button');
			blueBtn.className = 'btn btn-sm';
			blueBtn.textContent = 'Синие';
			blueBtn.onclick = () => assignTeam('Blue');
			actions.appendChild(blueBtn);

			const redBtn = document.createElement('button');
			redBtn.className = 'btn btn-sm';
			redBtn.textContent = 'Красные';
			redBtn.onclick = () => assignTeam('Red');
			actions.appendChild(redBtn);
			} else {
			if (player.role !== 'Spymaster') {
			const spyBtn = document.createElement('button');
			spyBtn.className = 'btn btn-sm';
			spyBtn.textContent = '★';
			spyBtn.title = 'Стать спаймастером';
			spyBtn.onclick = () => assignRole('Spymaster');
			actions.appendChild(spyBtn);
			} else {
			const operBtn = document.createElement('button');
			operBtn.className = 'btn btn-sm';
			operBtn.textContent = '☆';
			operBtn.title = 'Снять спаймастера';
			operBtn.onclick = () => assignRole('Operative');
			actions.appendChild(operBtn);
			}

			const leaveBtn = document.createElement('button');
			leaveBtn.className = 'btn btn-sm';
			leaveBtn.textContent = '✕';
			leaveBtn.title = 'Выйти из команды';
			leaveBtn.onclick = () => assignTeam(null);
			actions.appendChild(leaveBtn);
			}

			div.appendChild(actions);
			return div;
			}

			async function assignTeam(teamColor) {
			$('lobby-error').textContent = '';
			try {
			await post(`/api/rooms/${state.roomId}/team`, {
			playerId: state.myPlayerId,
			teamColor
			});
			} catch (e) { $('lobby-error').textContent = e.message; }
			}

			async function assignRole(role) {
			$('lobby-error').textContent = '';
			try {
			await post(`/api/rooms/${state.roomId}/role`, {
			playerId: state.myPlayerId,
			role
			});
			} catch (e) { $('lobby-error').textContent = e.message; }
			}

			function escapeHtml(s) {
			return String(s).replace(/[&<>"']/g, c => ({
			'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
			}[c]));
			}

			$('btn-create').onclick = async () => {
			$('error').textContent = '';
			const nick = $('nick').value.trim();
			if (!nick) { $('error').textContent = 'Введи ник'; return; }
			try {
			const lobby = await post('/api/rooms', { nickname: nick });
			const me = lobby.players.find(p => p.nickname === nick);
			if (!me) throw new Error('Не нашли себя в списке игроков.');
			state.myPlayerId = me.id;
			state.myNickname = nick;
			await enterLobby(lobby);
			} catch (e) { $('error').textContent = e.message; }
			};

			$('btn-join').onclick = async () => {
			$('error').textContent = '';
			const nick = $('nick').value.trim();
			const code = $('code').value.trim().toUpperCase();
			if (!nick) { $('error').textContent = 'Введи ник'; return; }
			if (!code) { $('error').textContent = 'Введи код'; return; }
			try {
			const lobby = await post(`/api/rooms/${code}/join`, { nickname: nick });
			const me = lobby.players.find(p => p.nickname === nick);
			if (!me) throw new Error('Не нашли себя в списке игроков.');
			state.myPlayerId = me.id;
			state.myNickname = nick;
			await enterLobby(lobby);
			} catch (e) { $('error').textContent = e.message; }
			};

			$('btn-start').onclick = async () => {
			$('lobby-error').textContent = '';
			try {
			await post(`/api/rooms/${state.roomId}/start`, { playerId: state.myPlayerId });
			} catch (e) { $('lobby-error').textContent = e.message; }
			};

			$('btn-leave-room').onclick = async () => {
			$('lobby-error').textContent = '';
			try {
			if (state.connection) {
			await state.connection.invoke('LeaveRoom', state.roomId, state.myPlayerId);
			try { await state.connection.stop(); } catch {}
			state.connection = null;
			}
			window.location.href = '/lobby.html';
			} catch (e) {
			console.error('[leave room]', e);
			window.location.href = '/lobby.html';
			}
			};

			$('btn-return-to-game').onclick = () => {
			window.location.href = `/game.html?roomId=${state.roomId}&playerId=${state.myPlayerId}`;
			};

			// === Init ===
			async function init() {
			const params = new URLSearchParams(window.location.search);
			const urlRoomId = params.get('roomId');
			const urlPlayerId = params.get('playerId');

			if (!urlRoomId) return;

			try {
			const lobby = await get(`/api/rooms/${urlRoomId}`);

			let foundId = null;
			let foundNick = null;

			if (urlPlayerId) {
			const byId = lobby.players.find(p => p.id === urlPlayerId);
			if (byId) { foundId = byId.id; foundNick = byId.nickname; }
			}

			if (!foundId) {
			const nick = $('nick').value.trim();
			const byNick = lobby.players.find(p => p.nickname === nick);
			if (byNick) { foundId = byNick.id; foundNick = byNick.nickname; }
			}

			if (!foundId) {
			window.history.replaceState({}, '', '/lobby.html');
			return;
			}

			state.myPlayerId = foundId;
			state.myNickname = foundNick;
			state.previousState = lobby.state;

			if (!STAY && (lobby.state === 'InGame' || lobby.state === 'Finished')) {
			goToGame(lobby);
			return;
			}

			await enterLobby(lobby);
			} catch (e) {
			console.warn('[init]', e);
			window.history.replaceState({}, '', '/lobby.html');
			}
			}

			init();
		</script>
	</body>
</html>
