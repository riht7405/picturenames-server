<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>PictureNames · Партия</title>
    <style>
        :root {
            --bg: #0f0f12;
            --card-bg: #17171c;
            --border: #26262e;
            --text: #e8e8e8;
            --text-dim: #8a8a94;
            --text-mute: #6a6a72;
            --blue-bg: #14243d;
            --blue-accent: #7ab8ff;
            --red-bg: #3d1616;
            --red-accent: #ff9a9a;
            --neutral-bg: #2a2a36;
            --neutral-accent: #8a8a94;
            --assassin-bg: #0a0a0a;
            --assassin-accent: #ff4d4d;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; padding: 1.5rem;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* === Инфо-бар === */
        .topbar {
            width: min(900px, 100%);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .topbar .left, .topbar .right { display: flex; gap: 1rem; align-items: center; }
        .room-code {
            font-family: monospace; font-size: 14px;
            letter-spacing: 0.2em; color: var(--text-dim);
        }
        .turn-indicator {
            padding: 0.35rem 0.8rem; border-radius: 999px;
            font-size: 13px; font-weight: 500;
            letter-spacing: 0.03em;
            transition: all 0.3s;
        }
        .turn-indicator.Blue {
            background: var(--blue-bg); color: var(--blue-accent);
            box-shadow: 0 0 12px rgba(122, 184, 255, 0.4);
        }
        .turn-indicator.Red {
            background: var(--red-bg); color: var(--red-accent);
            box-shadow: 0 0 12px rgba(255, 154, 154, 0.4);
        }
        .turn-indicator.none { background: var(--neutral-bg); color: var(--text-dim); }

        .score {
            display: flex; gap: 0.6rem; font-family: monospace; font-size: 14px;
        }
        .score .Blue { color: var(--blue-accent); }
        .score .Red { color: var(--red-accent); }

        .role-badge {
            font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-dim);
        }

        .btn-exit {
            font: inherit; font-size: 12px;
            padding: 0.35rem 0.7rem;
            background: var(--bg); color: var(--text-dim);
            border: 1px solid var(--border); border-radius: 6px;
            cursor: pointer;
        }
        .btn-exit:hover { color: var(--text); border-color: #3a3a48; }

        /* === Поле 5×5 === */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.6rem;
            width: min(900px, 100%);
        }

        .card {
            position: relative;
            aspect-ratio: 1 / 1;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: default;
            transition: transform 0.12s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            border: 2px solid transparent;
        }
        .card img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            user-select: none; -webkit-user-drag: none;
        }
        .card.revealable { cursor: pointer; }
        .card.revealable:hover { transform: scale(1.03); }

        /* Тонирующий слой — только для спаймастера */
        .card .tint {
            position: absolute; inset: 0;
            mix-blend-mode: multiply;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        /* === Спаймастер: неоновое свечение по цвету карты === */
        .card.spymaster.blue {
            border-color: rgba(80, 150, 255, 0.75);
            box-shadow: 0 0 16px rgba(80, 150, 255, 0.55),
                        inset 0 0 10px rgba(80, 150, 255, 0.35);
        }
        .card.spymaster.red {
            border-color: rgba(255, 100, 100, 0.75);
            box-shadow: 0 0 16px rgba(255, 100, 100, 0.55),
                        inset 0 0 10px rgba(255, 100, 100, 0.35);
        }
        .card.spymaster.neutral {
            border-color: rgba(140, 140, 150, 0.55);
            box-shadow: 0 0 10px rgba(140, 140, 150, 0.35);
        }
        .card.spymaster.assassin {
            border-color: rgba(255, 40, 40, 1);
            box-shadow: 0 0 24px rgba(255, 40, 40, 0.85),
                        inset 0 0 14px rgba(255, 40, 40, 0.55);
            animation: pulse-assassin 2.4s ease-in-out infinite;
        }
        @keyframes pulse-assassin {
            0%, 100% { box-shadow: 0 0 24px rgba(255, 40, 40, 0.85),
                                   inset 0 0 14px rgba(255, 40, 40, 0.55); }
            50%      { box-shadow: 0 0 34px rgba(255, 40, 40, 1),
                                   inset 0 0 18px rgba(255, 40, 40, 0.7); }
        }

        .card.spymaster.blue     .tint { background: rgba(80, 150, 255, 0.7); }
        .card.spymaster.red      .tint { background: rgba(255, 100, 100, 0.7); }
        .card.spymaster.neutral  .tint { background: rgba(120, 120, 130, 0.6); }
        .card.spymaster.assassin .tint { background: rgba(255, 40, 40, 0.85); }

        /* === Открытая карта: полный фон команды + свечение === */
        .card.revealed { cursor: default; }
        .card.revealed img { opacity: 0.35; }

        .card.revealed.blue {
            background: var(--blue-bg);
            border-color: var(--blue-accent);
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.45);
        }
        .card.revealed.red {
            background: var(--red-bg);
            border-color: var(--red-accent);
            box-shadow: 0 0 22px rgba(255, 100, 100, 0.45);
        }
        .card.revealed.neutral {
            background: var(--neutral-bg);
            border-color: var(--neutral-accent);
            box-shadow: 0 0 12px rgba(140, 140, 150, 0.3);
        }
        .card.revealed.assassin {
            background: var(--assassin-bg);
            border-color: var(--assassin-accent);
            box-shadow: 0 0 30px rgba(255, 40, 40, 0.6);
        }

        /* Метка в углу открытой карты */
        .card .badge {
            position: absolute; top: 6px; right: 8px;
            font-family: monospace; font-size: 11px;
            padding: 2px 6px; border-radius: 4px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .card.revealed .badge { opacity: 1; }

        .status {
            margin-top: 1rem; font-size: 12px; color: var(--text-mute);
            min-height: 1.2rem;
        }
        .error {
            margin-top: 1rem; font-size: 13px; color: #ff8a8a;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="left">
        <span class="room-code" id="room-code">----</span>
        <span class="turn-indicator none" id="turn">—</span>
    </div>
    <div class="right">
        <span class="score">
            <span class="Blue" id="score-blue">0/9</span>
            <span class="Red" id="score-red">0/8</span>
        </span>
        <span class="role-badge" id="my-role">—</span>
        <button class="btn-exit" id="btn-exit">Выйти</button>
    </div>
</div>

<div class="board" id="board"></div>

<div class="status" id="status">Подключение…</div>
<div class="error" id="error"></div>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('roomId');
    const playerId = params.get('playerId');

    if (!roomId || !playerId) {
        window.location.href = '/lobby.html';
    }

    const $ = id => document.getElementById(id);
    const state = {
        connection: null,
        myRole: null,
        myTeam: null,
        currentTurn: null,
        cards: [],
        teams: [],
    };

    function render(data) {
        state.myRole = data.yourRole;
        state.myTeam = data.yourTeam;
        state.currentTurn = data.currentTurnTeam;
        state.cards = data.cards;
        state.teams = data.teams;

        $('room-code').textContent = data.code;
        $('my-role').textContent = data.yourRole === 'Spymaster' ? 'Спаймастер' : 'Оперативник';

        const turn = $('turn');
        if (data.currentTurnTeam) {
            turn.textContent = data.currentTurnTeam === 'Blue' ? 'Ход синих' : 'Ход красных';
            turn.className = 'turn-indicator ' + data.currentTurnTeam;
        } else {
            turn.textContent = '—';
            turn.className = 'turn-indicator none';
        }

        renderScore();
        renderBoard();
    }

    function renderScore() {
        const blue = state.teams.find(t => t.color === 'Blue');
        const red = state.teams.find(t => t.color === 'Red');
        $('score-blue').textContent = `${blue?.score ?? 0}/9`;
        $('score-red').textContent = `${red?.score ?? 0}/8`;
    }

    function renderBoard() {
        const board = $('board');
        board.innerHTML = '';

        const sorted = [...state.cards].sort((a, b) => a.position - b.position);
        const isSpymaster = state.myRole === 'Spymaster';
        const isMyTurn = state.myTeam && state.currentTurn
            && state.myTeam === state.currentTurn;

        for (const card of sorted) {
            const el = document.createElement('div');
            el.className = 'card';
            if (isSpymaster && !card.isRevealed) el.classList.add('spymaster');

            const color = card.color ?? null;

            if (color && !card.isRevealed) {
                el.classList.add(color.toLowerCase());
            }
            if (card.isRevealed) {
                el.classList.add('revealed');
                if (color) el.classList.add(color.toLowerCase());
            }

            const img = document.createElement('img');
            img.src = card.imageUrl;
            img.alt = card.altText || '';
            img.draggable = false;
            el.appendChild(img);

            if (isSpymaster && !card.isRevealed && color) {
                const tint = document.createElement('div');
                tint.className = 'tint';
                el.appendChild(tint);
            }

            if (card.isRevealed && color) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.textContent = color[0];
                el.appendChild(badge);
            }

            if (!card.isRevealed && !isSpymaster && isMyTurn) {
                el.classList.add('revealable');
                el.onclick = () => onCardClick(card);
            }

            el.title = card.altText || '';
            board.appendChild(el);
        }
    }

    function onCardClick(card) {
        console.log('Клик по карте:', card);
        $('error').textContent = 'Логика ходов ещё не реализована.';
        setTimeout(() => $('error').textContent = '', 2000);
    }

    async function start() {
        const conn = new signalR.HubConnectionBuilder()
            .withUrl('/gamehub')
            .withAutomaticReconnect()
            .build();

        conn.on('GameStateUpdated', data => render(data));

        conn.on('LobbyUpdated', lobby => {
            if (lobby.state === 'Lobby') {
                window.location.href = '/lobby.html';
            }
        });

        conn.onreconnecting(() => $('status').textContent = 'Переподключение…');
        conn.onreconnected(async () => {
            $('status').textContent = 'Подключено';
            await conn.invoke('JoinGame', roomId, playerId);
        });
        conn.onclose(() => $('status').textContent = 'Соединение закрыто');

        await conn.start();
        await conn.invoke('JoinGame', roomId, playerId);
        state.connection = conn;
        $('status').textContent = 'Подключено · ' + conn.connectionId.slice(0, 8);
    }

    $('btn-exit').onclick = () => {
        window.location.href = '/lobby.html';
    };

    start().catch(err => {
        $('status').textContent = 'Ошибка';
        $('error').textContent = err.message;
    });
</script>
</body>
</html>
